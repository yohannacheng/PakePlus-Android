<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>花生的秘密基地 | Xia and Cheng's Secret Base</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥜</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="opening" id="opening"><div><h1>花生的秘密基地</h1><p>Xia and Cheng's Secret Base</p></div></div>

  <div class="app">
    <header class="top">
      <div class="person">
        <div class="name" id="otherName" title="点击修改昵称"></div>
        <div class="avatar" id="otherAvatar" title="双击拍一拍"></div>
        <div class="status" id="otherStatus"></div>
      </div>
      <div class="tools">
        <button class="btn btn-icon" id="darkBtn" title="夜间模式"><img src="图标/夜间模式.png" alt="夜间模式" /></button>
        <button class="btn btn-icon" id="moodBtn" title="心情天气"><img src="图标/心情天气.png" alt="心情天气" /></button>
        <button class="btn btn-icon" id="mailBtn" title="信箱"><img src="图标/信箱.png" alt="信箱" /></button>
        <button class="btn btn-icon" id="settingsBtn" title="设置"><img src="图标/设置.png" alt="设置" /></button>
      </div>
      <div class="person">
        <div class="name" id="myName"></div>
        <div class="avatar" id="myAvatar"></div>
        <div class="status" id="myStatus"></div>
      </div>
    </header>

    <div class="notice" id="noticeBar"></div>
    <main class="chat" id="chat"></main>

    <footer class="input">
      <div class="fold">
        <button class="btn btn-icon" id="foldBtn" title="折叠区"><img src="图标/折叠区.png" alt="折叠区" /></button>
        <div class="panel" id="foldPanel">
          <div class="grid foldGrid">
            <!-- 第一排：表情包/互动 -->
            <div class="card large" style="display:flex;flex-direction:column;gap:.25rem;align-items:center;justify-content:center;">
              <div class="stickerPreview" id="stickerPreview"></div>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:.35rem;width:100%">
                <button class="btn btn-icon" id="addStickerBtn" title="添加表情包"><img src="图标/添加表情包.png" alt="添加表情包" /></button>
                <button class="btn btn-icon" id="sendStickerBtn" title="发送表情包"><img src="图标/发送表情包.png" alt="发送表情包" /></button>
              </div>
              <div style="display:flex;gap:.35rem;align-items:center;width:100%">
                <input id="quickInteractInput" type="text" placeholder="输入互动内容" style="flex:1" />
                <button class="btn btn-icon" id="sendInteractBtn" title="发送互动"><img src="图标/发送互动.png" alt="发送互动" /></button>
              </div>
            </div>

            <!-- 第二排：塔罗 -->
            <div class="card large" style="display:flex !important;flex-direction:column;gap:.25rem;align-items:center;justify-content:center;min-height:140px;">
              <div style="display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center;">
                <button class="btn btn-icon" id="fortuneBtn" title="日运"><img src="图标/日运.png" alt="日运" /></button>
                <button class="btn btn-icon" id="tarotBtn" title="占卜（三张牌）"><img src="图标/占卜（三张牌）.png" alt="占卜（三张牌）" /></button>
              </div>
              <div class="tarotWrap" id="tarotResult"></div>
            </div>

            <!-- 第三排：四个独立格子 -->
            <div class="row-4">
              <div class="card" style="display:flex;flex-direction:column;gap:.25rem;align-items:center;justify-content:center;">
                <button class="btn btn-icon" id="callBtn" title="发起视频通话"><img src="图标/发起视频通话.png" alt="发起视频通话" /></button>
              </div>
              <div class="card" style="display:flex;flex-direction:column;gap:.25rem;align-items:center;justify-content:center;">
                <button class="btn btn-icon" id="imgInputBtn" title="发送图片"><img src="图标/发送图片.png" alt="发送图片" /></button>
                <input type="file" id="imgInput" accept="image/*" style="display:none;" />
              </div>
              <div class="card" style="display:flex;flex-direction:column;gap:.25rem;align-items:center;justify-content:center;">
                <button class="btn btn-icon" id="forceOtherBtn" title="再发一条"><img src="图标/再发一条.png" alt="再发一条" /></button>
              </div>
              <div class="card" style="display:flex;flex-direction:column;gap:.25rem;align-items:center;justify-content:center;">
                <button class="btn btn-icon" id="queueModeBtn" title="保留框开关"><img src="图标/保留框开关.png" alt="保留框开关" /></button>
                <button class="btn primary btn-icon" id="queueFlushBtn" title="全部发送"><img src="图标/全部发送.png" alt="全部发送" /></button>
                <div class="tiny" id="queueInfo"></div>
              </div>
            </div>

          </div>
        </div>
      </div>

      <div style="position:relative;flex:1;">
        <input id="msgInput" type="text" placeholder="输入消息" />
      </div>
      <button class="btn btn-icon" id="sendBtn" title="发送"><img src="图标/发送.png" alt="发送" /></button>
    </footer>
  </div>

  <!-- 通话悬浮窗 -->
  <div class="callFloat" id="callFloat">
    <div class="callTitle" id="callTitle">视频通话</div>
    <div class="tiny" id="callStatus"></div>
    <div id="callPeerName" class="tiny" style="margin:.2rem 0;display:none;"></div>
    <div id="callTimer" style="font-size:1.1rem;font-weight:700;margin:.2rem 0;display:none;">00:00</div>
    <div class="callActions" style="margin-top:.45rem">
      <button class="btn danger" id="rejectCallBtn" style="display:none;">拒接</button>
      <button class="btn primary" id="acceptCallBtn" style="display:none;">接听</button>
      <button class="btn danger" id="hangupCallBtn" style="display:none;">挂断</button>
    </div>
  </div>

  <!-- 设置 -->
  <div class="mask" id="settingsMask">
    <div class="modal">
      <h3>设置中心</h3>
      <div class="tabs" id="settingsTabs"></div>
      <div id="settingsBody"></div>
      <div style="margin-top:.6rem;text-align:right"><button class="btn" id="closeSettingsBtn">关闭</button></div>
    </div>
  </div>

  <!-- 运势 -->
  <div class="mask" id="fortuneMask">
    <div class="modal">
      <h3>今日运势</h3>
      <div class="block" id="fortuneView"></div>
      <div style="margin-top:.6rem;text-align:right"><button class="btn" id="closeFortuneBtn">关闭</button></div>
    </div>
  </div>

  <!-- 占卜 -->
  <div class="mask" id="tarotMask">
    <div class="modal">
      <h3>塔罗占卜</h3>
      <div class="block" id="tarotView"></div>
      <div style="margin-top:.6rem;text-align:right"><button class="btn" id="closeTarotBtn">关闭</button></div>
    </div>
  </div>

  <!-- 心情天气 -->
  <div class="mask" id="moodMask">
    <div class="modal">
      <h3>心情与天气</h3>
      <div class="mgrid">
        <div class="block">
          <b>对方心情</b>
          <div id="otherMoodView" class="list tiny"></div>
          <b>对方天气</b>
          <div id="otherWeatherView" class="list tiny"></div>
        </div>
        <div class="block">
          <b>我的心情</b>
          <input id="myMoodEmojiInput" type="text" placeholder="emoji" />
          <input id="myMoodEventInput" type="text" placeholder="事件简述" />
          <button class="btn" id="addMyMoodBtn">添加我的心情</button>

          <b>我的天气</b>
          <input id="myWeatherInput" type="text" placeholder="如 🌤️ 想你" />
          <button class="btn" id="saveMyWeatherBtn">保存我的天气</button>
          <div id="myWeatherLatest" class="tiny"></div>
        </div>
      </div>
      <div class="block" style="margin-top:.6rem">
        <b>本月心情日历</b>
        <div id="calendar" class="calendar"></div>
      </div>
      <div style="margin-top:.6rem;text-align:right"><button class="btn" id="closeMoodBtn">关闭</button></div>
    </div>
  </div>

  <!-- 信箱 -->
  <div class="mask" id="mailMask">
    <div class="modal">
      <h3>信箱</h3>
      <div class="mgrid">
        <div class="block">
          <b>写信</b>
          <textarea id="myLetterInput" placeholder="写给对方的一封信"></textarea>
          <button class="btn primary" id="sendLetterBtn">发送信件</button>
        </div>
        <div class="block">
          <b>我们的信箱</b>
          <div style="display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-bottom:.4rem;">
            <input id="mailSearchInput" type="text" placeholder="按信件内容或回信搜索" style="flex:1" />
            <button class="btn" id="mailSearchBtn">搜索</button>
          </div>
          <div id="mailInfo" class="tiny"></div>
          <div id="mailList" class="list" style="max-height:360px;overflow:auto;"></div>
        </div>
      </div>
      <div style="margin-top:.6rem;text-align:right"><button class="btn" id="closeMailBtn">关闭</button></div>
    </div>
  </div>

  <!-- 邮件详情 -->
  <div class="mask" id="mailDetailMask">
    <div class="modal">
      <h3>信件详情</h3>
      <div class="block">
        <div id="mailDetailDirection" class="tiny" style="margin-bottom:.5rem;"></div>
        <div id="mailDetailTime" class="tiny" style="margin-bottom:.5rem;"></div>
        <div id="mailDetailContent" style="line-height:1.6;white-space:pre-wrap;"></div>
      </div>
      <div style="margin-top:.6rem;text-align:right"><button class="btn" id="closeMailDetailBtn">关闭</button></div>
    </div>
  </div>

  <!-- 写信弹窗 -->
  <div class="mask" id="composeMailMask">
    <div class="modal">
      <h3>写信</h3>
      <textarea id="composeMailContent" placeholder="写给对方的一封信" style="width:100%;min-height:200px;"></textarea>
      <div style="margin-top:.6rem;text-align:right">
        <button class="btn" id="cancelComposeMailBtn">取消</button>
        <button class="btn primary" id="sendComposeMailBtn">发送</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
